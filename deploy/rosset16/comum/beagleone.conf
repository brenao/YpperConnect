# BeagleOne (ex-YpperConnect): publica em /beagleone/ o container beagleone-app do rosset29 (TESTE).
#
# Espelho do rosset30/comum/beagleone.conf (producao), trocando so o upstream. Este arquivo
# e a fonte da verdade; o do servidor e a copia. Ate 2026-09-14 o teste publicava
# /ypper/ (comum/ypper.conf); ao trocar, REMOVER o include antigo das 3 marcas.
#
# INCLUIDO por uma linha em cada server block de marca:
#     include /etc/nginx/conf.d/comum/beagleone.conf;
#
# Vive em conf.d/comum/ pelo mesmo motivo do limite-login.conf: o nginx.conf
# faz `include /etc/nginx/conf.d/*.conf`, que nao desce em subdiretorio, entao
# este arquivo so entra onde for incluido de proposito. Um arquivo unico para
# set-teste.rosset.conf, teste.valisere.conf e testerosset.conf evita que as
# marcas divirjam com o tempo -- o risco levantado no PRE-10.
#
# Modelado no bloco `location /vue` que ja existe nesses arquivos.

# /beagleone sem barra -> redireciona para /beagleone/.
# Sem isto, o unico acerto de prefixo seria "/beagleone" e o app receberia
# um caminho que ele nao conhece.
location = /beagleone {
   return 301 https://$host/beagleone/;
}

# ^~ garante que nenhuma location por regex roube esta rota.
location ^~ /beagleone/ {
   if ($cache_disabled) {
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
      add_header Pragma "no-cache";
      add_header Expires "0";
   }

   access_by_lua_file lua/check-token.lua;

   proxy_set_header                X-Localhost true;
   proxy_set_header                X-Real-IP $remote_addr;
   proxy_set_header                X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header                X-Forwarded-Proto https;
   proxy_set_header                Authorization "Bearer $http_x_authentication_token";

   # O app e SSR: ele monta URL absoluta a partir do Host recebido.
   # Sem esta linha o nginx manda o Host do upstream (rosset29) e links
   # e redirects saem apontando para o servidor interno.
   proxy_set_header                Host $host;

   # SEM barra no final de proposito: assim o nginx repassa a URI inteira,
   # com o prefixo /beagleone/. O app foi construido com APP_BASE_PATH=/beagleone/
   # e espera receber o prefixo. Trocar por ".../;" quebra os assets.
   proxy_pass http://rosset29.rosset.grp:8083;
   proxy_redirect off;

   # SSE do assistente de IA (rota /api/chat, streaming via Vercel AI SDK).
   # Sem desligar o buffer, a resposta so aparece quando termina.
   proxy_buffering off;
   proxy_read_timeout 300s;

   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection $http_connection;
}
